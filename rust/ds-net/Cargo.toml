[package]
name = "ds-net"
description = "directswarm native adapter: libp2p transport, Bee wire protocols, settlement I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ds-core = { path = "../ds-core" }
# ant wire crates, added as milestones need them. Path deps during
# development, pinned to a git rev before anything ships.
# M1: manifest/joiner layer + chunk validation (bee-API fallback path).
# M2 adds ant-p2p (handshake/retrieval/settlement wire) and ant-chain.
ant-chain = { path = "../../../ant/crates/ant-chain", features = ["chain-rpc"] }
ant-crypto = { path = "../../../ant/crates/ant-crypto" }
ant-p2p = { path = "../../../ant/crates/ant-p2p" }
ant-retrieval = { path = "../../../ant/crates/ant-retrieval" }
anyhow = "1"
async-trait = "0.1.89"
base64 = "0.22.1"
futures = "0.3.31"
getrandom = "0.3"
hex = "0.4.3"
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
libp2p = { version = "0.56.0", features = [
  "dns", "identify", "macros", "noise", "ping", "secp256k1", "tcp", "tokio", "yamux",
] }
libp2p-stream = "0.4.0-alpha"
primitive-types = { version = "0.14.0", default-features = false }
# Talks only to the local bee node over plain HTTP — no TLS features
# (the Gnosis RPC lives behind ant-chain's own client).
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tracing = "0.1"

# keystore.rs (vendored from antd): Web3 v3 decryption
aes = "0.8.4"
ctr = "0.9.2"
pbkdf2 = { version = "0.12.2", default-features = false }
scrypt = { version = "0.11.0", default-features = false }
sha2 = "0.10"

[lints]
workspace = true
